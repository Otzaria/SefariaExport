name: Sefaria Export via Docker Compose

on:
  workflow_dispatch:
    inputs:
      timezone:
        description: "Timezone for timestamp/tag (IANA name)"
        required: false
        default: "Asia/Jerusalem"
      post_to_forum:
        description: "Publish the changelog to the Otzaria forum"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  TZ_NAME: ${{ inputs.timezone || 'Asia/Jerusalem' }}

jobs:
  export_release:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Compute release timestamp
        id: ts
        run: |
          TS_STAMP=$(TZ="${TZ_NAME}" date '+%Y-%m-%d_%H-%M')
          echo "stamp=$TS_STAMP" >> "$GITHUB_OUTPUT"
          echo "Timestamp: $TS_STAMP"

      - name: Run export pipeline via Docker Compose
        env:
          TS_STAMP: ${{ steps.ts.outputs.stamp }}
        run: docker compose up --build --abort-on-container-exit

      - name: Stop and clean up containers
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Move archives to workspace root
        run: |
          ls -la ./output/ || true
          # Files inside ./output/ are root-owned (docker container ran as root
          # against the bind mount). sudo lets the runner user move them out,
          # and we keep the errors visible to catch real failures.
          sudo chown -R "$(id -u):$(id -g)" ./output
          mv ./output/sefaria-exports-*.tar.zst* ./
          # The content manifest produced by 15a_generate_manifest.sh.
          mv ./output/manifest.txt ./ 2>/dev/null || true
          ls -la ./sefaria-exports-*.tar.zst* ./manifest.txt || true

      - name: Ensure gh CLI
        run: |
          chmod +x ./19_ensure_gh_cli.sh
          bash ./19_ensure_gh_cli.sh

      - name: Create/Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TS_STAMP: ${{ steps.ts.outputs.stamp }}
        run: |
          chmod +x ./20_create_or_update_release.sh
          bash ./20_create_or_update_release.sh

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TS_STAMP: ${{ steps.ts.outputs.stamp }}
        run: |
          chmod +x ./21_upload_release_assets.sh
          bash ./21_upload_release_assets.sh

      - name: Generate changelog and publish to Otzaria forum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TS_STAMP: ${{ steps.ts.outputs.stamp }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          POST_TO_FORUM: ${{ inputs.post_to_forum }}
        run: |
          python3 -m pip install --quiet requests beautifulsoup4 pyluach tzdata
          chmod +x ./22_generate_changelog.sh
          bash ./22_generate_changelog.sh
