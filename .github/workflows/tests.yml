name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # The suite imports the forum client and the image validator.
      - name: Install test dependencies
        run: python3 -m pip install --quiet requests beautifulsoup4 pyluach tzdata pillow

      - name: Run exporter and release-tool tests
        run: python3 -m unittest discover -v
